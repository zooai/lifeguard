[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zooai-lifeguard"
version = "1.0.0"
description = "Open-Source Life Preservation & Decision Intelligence Framework for Autonomous AI"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Zoo Labs Foundation", email = "contact@zoo.ngo" },
    { name = "Zach Kelling", email = "z@zeekay.io" },
]
keywords = [
    "ai-safety",
    "decision-intelligence",
    "life-preservation",
    "trolley-problem",
    "complement-consistency",
    "alignment",
    "open-source-ai",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "scipy>=1.9.0",
]

[project.urls]
Homepage = "https://zoo.ngo"
Repository = "https://github.com/zooai/lifeguard"
Documentation = "https://github.com/zooai/lifeguard#readme"
Research = "https://papers.zoo.ngo"

[project.scripts]
lifeguard-eval = "lifeguard.evaluate:main"

[tool.hatch.build.targets.wheel]
packages = ["lifeguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
